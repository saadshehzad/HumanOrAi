<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f4f4;
      }

      main {
        max-width: 600px;
        margin: 100px auto;
        padding: 32px;
        text-align: center;
        background: white;
      }

      button {
        padding: 10px 18px;
        border: 0;
        background: #222;
        color: white;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
      }

      #result {
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>{{ title }}</h1>
      <form action="/predict" method="get">
        <button type="submit">Predict</button>
      </form>
    </main>
  </body>
</html>
